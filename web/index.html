<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2nd Eye - AlgoR3IthM</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#111827; --muted:#374151; --line:#9ca3af;
  --brand:#0b3d91; --brand-ink:#fff;
  --safe-bg:#dcfce7; --safe:#14532d; --safe-line:#15803d;
  --warn-bg:#fef3c7; --warn:#78350f; --warn-line:#b45309;
  --bad-bg:#fee2e2; --bad:#7f1d1d; --bad-line:#b91c1c;
  --hl:#fde047;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1rem;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #2563eb;outline-offset:2px}
header{background:var(--brand);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:48px;height:48px;flex:none}
.brand{flex:1;min-width:180px}
.brand b{display:block;font-size:1.5rem;line-height:1.1}
.brand span{font-size:1rem;opacity:.95}
.status{display:flex;align-items:center;gap:6px;font-size:1rem;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px}
.dot{width:14px;height:14px;border-radius:50%;background:#9ca3af;border:2px solid #fff;flex:none}
.dot.on{background:#22c55e}.dot.rules{background:#facc15}.dot.off{background:#ef4444}
.hbtn{background:#fff;color:var(--brand);border:2px solid #fff;border-radius:10px;padding:6px 12px;font-weight:700;min-height:44px}
nav{display:flex;gap:6px;padding:10px 14px 0;max-width:1200px;margin:0 auto}
nav button{flex:1;padding:12px 8px;border:3px solid var(--brand);border-bottom:0;border-radius:12px 12px 0 0;background:#fff;color:var(--brand);font-weight:700;font-size:1.05rem}
nav button[aria-selected=true]{background:var(--brand);color:#fff}
main{max-width:1200px;margin:0 auto;padding:0 14px 40px}
.panel{background:var(--card);border:3px solid var(--brand);border-radius:0 0 14px 14px;padding:16px}
h2{margin:.2em 0 .5em;font-size:1.3rem}
textarea{width:100%;min-height:200px;font-size:1.15rem;padding:12px;border:3px solid var(--line);border-radius:12px;resize:vertical;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.btn{border:3px solid var(--brand);background:#fff;color:var(--brand);border-radius:12px;padding:10px 16px;font-weight:700;min-height:48px}
.btn.big{display:block;width:100%;background:var(--brand);color:#fff;font-size:1.6rem;padding:18px 12px;min-height:72px;border-radius:16px}
.btn:disabled{opacity:.6;cursor:wait}
.check{display:flex;align-items:center;gap:10px;font-size:1.05rem}
.check input{width:28px;height:28px;flex:none}
.msg{padding:12px 14px;border-radius:12px;border:3px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);font-weight:600;margin:10px 0}
.msg.info{border-color:var(--brand);background:#dbeafe;color:#1e3a8a}
.hidden{display:none!important}
.love{background:#fff;color:var(--ink);border:3px solid var(--brand);border-radius:12px;padding:14px;margin-top:14px}
.love h3{margin:0 0 8px;font-size:1.3rem}
.love ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.love li{border:3px solid var(--line);border-radius:10px;padding:8px 10px;font-size:1.05rem}
.love li.yes{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn);font-weight:700}
.love li b{display:block;font-size:1.05rem}
.love .big{font-size:1.5rem;font-weight:800;line-height:1.3;margin:12px 0 0}

/* result */
.result{border:5px solid;border-radius:18px;padding:16px;margin-top:16px}
.result.SAFE{background:var(--safe-bg);border-color:var(--safe-line);color:var(--safe)}
.result.SUSPICIOUS{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.result.SCAM{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.vhead{display:flex;gap:12px;align-items:center}
.vicon{font-size:3rem;line-height:1;flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid currentColor;font-weight:900}
.vlabel{font-size:1.9rem;font-weight:800;line-height:1.15}
.warning{font-size:1.65rem;line-height:1.35;margin:14px 0;font-weight:600;color:var(--ink);background:#fff;border-radius:12px;padding:14px}
.chips-title{font-weight:800;font-size:1.15rem;margin:12px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:3px solid currentColor;border-radius:99px;padding:6px 14px;font-weight:700;font-size:1.1rem;color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1;min-width:200px;font-size:1.15rem}
.tel{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
details{margin-top:12px;color:var(--ink)}
summary{cursor:pointer;font-weight:700;padding:6px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:.95rem;background:#fff;border:2px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--ink)}
/* thread */
.thread{display:flex;flex-direction:column;gap:12px;margin-top:14px;color:var(--ink)}
.bwrap{display:flex;flex-direction:column;max-width:92%}
.bwrap.sender{align-self:flex-start}
.bwrap.reader{align-self:flex-end;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:16px;font-size:1.1rem;white-space:pre-wrap;word-break:break-word;border:3px solid var(--line);background:#fff}
.bwrap.reader .bubble{background:#d1d5db;border-color:#6b7280;border-bottom-right-radius:4px}
.bwrap.sender .bubble{border-bottom-left-radius:4px}
.bwrap.first .bubble{border:5px solid var(--bad-line);background:#fff5f5}
.firstlbl{background:var(--bad-line);color:#fff;font-weight:800;padding:4px 10px;border-radius:8px 8px 0 0;align-self:flex-start;font-size:1rem}
.who{font-size:.95rem;color:var(--muted);margin:0 6px 2px}
mark{background:var(--hl);color:#000;border-radius:4px;padding:0 2px;font-weight:700;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.nf{margin-top:4px}
.nf .tag{border-color:var(--bad-line);color:var(--bad);background:#fff5f5;font-weight:600}
.risk{margin-top:6px;width:min(420px,100%)}
.rbar{position:relative;height:16px;background:#e5e7eb;border:2px solid #4b5563;border-radius:8px;overflow:hidden}
.rfill{height:100%}
.rtick{position:absolute;top:0;bottom:0;width:3px;background:#000}
.rtxt{font-size:.9rem;color:var(--muted);display:flex;justify-content:space-between}
/* dashboard */
.drop{border:4px dashed var(--brand);border-radius:14px;padding:16px;text-align:center;background:#eff6ff}
.drop.over{background:#bfdbfe}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sbox{flex:1;min-width:120px;border:3px solid;border-radius:12px;padding:6px 10px;text-align:center;font-weight:800;font-size:1.2rem;background:#fff}
.sbox small{display:block;font-weight:600;font-size:.95rem}
.sbox.SAFE{border-color:var(--safe-line);color:var(--safe)}
.sbox.SUSPICIOUS{border-color:var(--warn-line);color:var(--warn)}
.sbox.SCAM{border-color:var(--bad-line);color:var(--bad)}
.sbox.ALL{border-color:var(--brand);color:var(--brand)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1.1rem;min-width:820px}
th{background:var(--brand);color:#fff;text-align:left;padding:6px 8px;position:sticky;top:0}
td{padding:3px 8px;border-bottom:2px solid #d1d5db;white-space:nowrap}
td.fl{white-space:normal;font-size:.85rem;font-family:ui-monospace,Consolas,monospace;line-height:1.2}
tbody tr{cursor:pointer;height:38px}
tbody tr:hover{background:#eff6ff}
tbody tr:focus-visible{outline:4px solid #2563eb;outline-offset:-4px}
.vb{display:inline-block;font-weight:800;padding:1px 10px;border-radius:8px;border:3px solid}
.vb.SAFE{background:var(--safe-bg);color:var(--safe);border-color:var(--safe-line)}
.vb.SUSPICIOUS{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.vb.SCAM{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.vb.ERR{background:#e5e7eb;border-color:#4b5563}
td.diff{background:#fecaca;outline:3px solid var(--bad-line);outline-offset:-3px;font-weight:800}
.progress{height:20px;border:2px solid var(--brand);border-radius:10px;overflow:hidden;background:#fff}
.progress div{height:100%;background:var(--brand);width:0}
.cmp{margin-top:10px;font-weight:700;font-size:1.1rem}
dialog{border:5px solid var(--brand);border-radius:16px;padding:16px;max-width:760px;width:calc(100% - 20px);max-height:92vh;overflow:auto;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-weight:700;margin:10px 0 4px}
dialog input[type=text],dialog input[type=tel]{width:100%;padding:10px;border:3px solid var(--line);border-radius:10px;font-size:1.1rem}
.toolbar{display:block}
body.compact header{padding:4px 14px}
body.compact .logo{width:34px;height:34px}
body.compact .brand span{display:none}
body.compact .brand b{font-size:1.2rem}
body.compact nav{padding-top:6px}
body.compact nav button{padding:6px 8px}
body.compact .panel{padding:8px}
body.compact .drop{padding:0 8px;border-width:2px;border-radius:8px}
body.compact .drop>div:first-child{display:none}
body.compact .drop .row{margin:2px 0}
body.compact .drop .btn{min-height:30px;padding:0 12px;border-width:2px}
body.compact .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body.compact .summary{flex:1;margin:6px 0;flex-wrap:nowrap}
body.compact .sbox{padding:0 8px;min-width:0;font-size:1.1rem;display:flex;gap:8px;align-items:center;justify-content:center}
body.compact .toolbar .row{margin:0;flex-wrap:nowrap}
body.compact .toolbar .btn{min-height:36px;padding:2px 10px;font-size:.95rem}
body.compact .cmp{margin:2px 0;font-size:1rem}
body.compact th{padding:3px 8px}
body.compact main,body.compact nav{max-width:1700px}
body.compact td,body.compact th{line-height:1.1}
body.compact tbody tr{height:25px}
body.compact td.fl{font-size:.78rem;overflow-wrap:anywhere}
body.compact .msg{padding:4px 10px;margin:4px 0;font-size:.95rem}
body.compact td{padding:0 8px}
body.compact .vb{padding:0 8px;border-width:2px;font-size:1rem;line-height:1.05}
body.compact nav button{font-size:1rem}
/* import tab */
.hint{font-size:1.05rem;color:var(--muted);margin:6px 0 10px}
.q{font-weight:800;font-size:1.25rem;margin:16px 0 8px}
.pbtns{display:flex;gap:10px;flex-wrap:wrap}
.pbtn{border:3px solid var(--brand);background:#fff;color:var(--brand);border-radius:14px;padding:12px 18px;font-weight:800;font-size:1.3rem;min-height:56px;max-width:100%;overflow-wrap:anywhere}
.pbtn[aria-pressed=true]{background:var(--brand);color:#fff}
select{font-size:1.15rem;padding:10px;border:3px solid var(--line);border-radius:10px;background:#fff;min-height:48px;max-width:100%}
.impthread{max-height:420px;overflow-y:auto;padding:10px;border:3px solid var(--line);border-radius:12px;background:#f9fafb;margin-top:6px}
.fmtline{font-weight:700;margin:10px 0 0}
@media (max-width:480px){
  .vlabel{font-size:1.6rem}.warning{font-size:1.45rem}.btn.big{font-size:1.4rem}
  nav{padding:8px 8px 0}main{padding:0 8px 30px}.panel{padding:10px}
}
@media (min-width:900px){ .warning{font-size:1.9rem} .vlabel{font-size:2.2rem} }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Shield">
    <path d="M32 4 56 13v18c0 15-10 25-24 29C18 56 8 46 8 31V13z" fill="#fff"/>
    <path d="M32 10 50 17v14c0 11-7 19-18 23C21 50 14 42 14 31V17z" fill="#0b3d91"/>
    <path d="M23 32l7 7 12-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="brand"><b>2nd Eye</b><span>Scam Shield &middot; <strong>AlgoR3IthM</strong></span></div>
  <div class="status" id="status" role="status"><span class="dot" id="dot"></span><span id="statusTxt"></span></div>
  <button class="hbtn" id="btnSettings" type="button"><span aria-hidden="true">&#9742;</span> <span data-i="settings"></span></button>
  <button class="hbtn" id="btnLang" type="button" aria-label="Limba / Language">EN</button>
</header>

<div id="liveAlert" class="hidden" role="alert" style="max-width:1100px;margin:12px auto;padding:0 16px"></div>
<nav role="tablist">
  <button role="tab" id="tabCheck" aria-selected="true" aria-controls="pCheck" data-i="tabCheck"></button>
  <button role="tab" id="tabImp" aria-selected="false" aria-controls="pImp" data-i="tabImp"></button>
  <button role="tab" id="tabDash" aria-selected="false" aria-controls="pDash" data-i="tabDash"></button>
  <button role="tab" id="tabLive" aria-selected="false" aria-controls="pLive" data-i="tabLive"></button>
</nav>

<main>
<section class="panel" id="pCheck" role="tabpanel">
  <h2 data-i="pasteTitle"></h2>
  <textarea id="txt" data-ph="pastePh" aria-label="Message"></textarea>
  <div class="row">
    <button class="btn" id="btnFile" type="button"><span aria-hidden="true">&#128193;</span> <span data-i="openFile"></span></button>
    <input type="file" id="fileOne" accept=".json,application/json" class="hidden">
    <label class="check"><input type="checkbox" id="known"> <span data-i="known"></span></label>
  </div>
  <div id="fileNote" class="msg info hidden"></div>
  <button class="btn big" id="btnGo" type="button"><span aria-hidden="true">&#128269;</span> <span data-i="go"></span></button>
  <div id="checkMsg" class="msg hidden" role="alert"></div>
  <div id="resultBox"></div>
</section>

<section class="panel hidden" id="pImp" role="tabpanel">
  <h2 data-i="impTitle"></h2>
  <div class="hint" data-i="impHint"></div>
  <textarea id="impTxt" data-ph="impPh" aria-label="Conversation"></textarea>
  <div class="row">
    <button class="btn" id="impFileBtn" type="button"><span aria-hidden="true">&#128193;</span> <span data-i="impOpen"></span></button>
    <input type="file" id="impFile" accept=".txt,text/plain" class="hidden">
  </div>
  <div id="impNote" class="msg info hidden" role="status"></div>
  <div id="impStep" class="hidden">
    <div class="fmtline" id="impFmt"></div>
    <div id="impWho">
      <div class="q" id="impQ"></div>
      <div class="pbtns" id="impBtns" role="group" aria-labelledby="impQ"></div>
    </div>
    <div class="row">
      <label for="impChan" style="font-weight:700" data-i="impChan"></label>
      <select id="impChan">
        <option value="whatsapp">WhatsApp</option><option value="sms">SMS</option><option value="telegram">Telegram</option>
        <option value="messenger">Messenger</option><option value="email">Email</option>
      </select>
      <label class="check"><input type="checkbox" id="impKnown"> <span data-i="impKnown"></span></label>
    </div>
    <div class="q" data-i="impPrev"></div>
    <div class="impthread thread" id="impThread" tabindex="0"></div>
    <div style="height:14px"></div>
    <button class="btn big" id="impGo" type="button"><span aria-hidden="true">&#128269;</span> <span id="impGoTxt"></span></button>
  </div>
  <div id="impMsg" class="msg hidden" role="alert"></div>
  <div id="impResult"></div>
</section>

<section class="panel hidden" id="pDash" role="tabpanel">
  <div class="drop" id="drop">
    <div style="font-weight:700" data-i="dropTitle"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="btnFolder" type="button"><span aria-hidden="true">&#128194;</span> <span data-i="loadFolder"></span></button>
      <button class="btn" id="btnFiles" type="button"><span aria-hidden="true">&#128196;</span> <span data-i="loadFiles"></span></button>
    </div>
    <input type="file" id="inFolder" webkitdirectory directory multiple class="hidden">
    <input type="file" id="inFiles" accept=".json,application/json" multiple class="hidden">
    <div class="progress hidden" id="prog"><div id="progBar"></div></div>
    <div id="progTxt"></div>
  </div>
  <div id="dashMsg" class="msg hidden" role="alert"></div>
  <div class="toolbar"><div class="summary" id="summary"></div>
  <div class="row" id="dashActs">
    <button class="btn" id="btnCsv" type="button" disabled><span aria-hidden="true">&#128190;</span> <span data-i="exportCsv"></span></button>
    <button class="btn" id="btnCmp" type="button" disabled><span aria-hidden="true">&#9878;</span> <span data-i="compare"></span></button>
    <input type="file" id="inCsv" accept=".csv,text/csv" class="hidden">
  </div></div>
  <div class="cmp" id="cmpOut"></div>
  <div class="tw"><table id="tbl">
    <thead><tr><th>ID</th><th data-i="colVerdict"></th><th data-i="colType"></th><th data-i="colScore"></th><th data-i="colFirst"></th><th data-i="colFlags"></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</section>

<section class="panel hidden" id="pLive" role="tabpanel">
  <h2 data-i="liveTitle"></h2>
  <div id="liveStatus" class="hint" aria-live="polite"></div>
  <div class="hint" data-i="liveNote"></div>
  <div class="row"><button class="btn" id="liveClear" type="button"><span aria-hidden="true">&#128465;</span> <span data-i="liveClear"></span></button></div>
  <div class="hint" data-i="liveOpen"></div>
  <div id="liveList"></div>
</section>
</main>

<dialog id="dlgDetail">
  <div class="row" style="justify-content:space-between"><h2 id="detTitle" style="margin:0"></h2><button class="btn" id="detClose" type="button" data-i="close"></button></div>
  <div id="detBody"></div>
</dialog>

<dialog id="dlgSet">
  <h2 data-i="settingsTitle"></h2>
  <p data-i="settingsHelp"></p>
  <label for="tName" data-i="tName"></label>
  <input type="text" id="tName" autocomplete="off">
  <label for="tNum" data-i="tNum"></label>
  <input type="tel" id="tNum" inputmode="tel" autocomplete="off" placeholder="07xx xxx xxx">
  <div class="row"><button class="btn" id="setSave" type="button" data-i="save"></button><button class="btn" id="setClear" type="button" data-i="clear"></button><button class="btn" id="setClose" type="button" data-i="close"></button></div>
</dialog>

/* ---------- API ---------- */
function postJSON(url, body){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){
      if(!r.ok){ var e=new Error("http"); e.kind="bad"; throw e; }
      return r.json();
   }, function(){ var e=new Error("net"); e.kind="server"; throw e; })
   .then(function(j){
      if(!j || typeof j!=="object" || !j.verdict){ var e=new Error("shape"); e.kind="bad"; throw e; }
      return j;
   });
}

function loveCard(r){

  if(!isRom) return null;
  var msgs = pm.filter(function(m){ return m.from==="sender"; });
  var all = msgs.map(function(m){ return lowFold(m.text==null?"":m.text); }).join(" \n ");
  var half = msgs.slice(0, Math.ceil(msgs.length/2)).map(function(m){ return lowFold(m.text==null?"":m.text); }).join(" \n ");
  var fl = {}; flags.forEach(function(f){ fl[f]=1; });
  msgs.forEach(function(m){ (m.new_flags||[]).forEach(function(f){ fl[f]=1; }); });
  function has(txt, re){ return re.test(txt); }
  var found = [
    r.known_contact===false || has(all, /ne-?am cunoscut pe|am gresit numarul|te-?am vazut pe (facebook|instagram|tinder)|te-?am gasit pe|ti-?am vazut profilul|mesaj gresit|numar gresit/),
    has(half, /te iubesc|iubirea mea|suflet pereche|dragostea mea|sotia mea|sotul meu|mi-?e dor de tine|dragoste la prima|te ador/),
    has(all, /platforma petrol|platforma|nava|pe mare|misiune|armata|armatei|onu|medic in strainatate|contract|camera nu merge|nu pot vorbi video|fara video|semnal slab|nu pot sa ne vedem|nu putem sa ne vedem|nu pot veni/),
    !!(fl.RF_CHANNEL_SWITCH || fl.RF_SECRECY) || has(all, /sa nu le spui|nu spune (nimanui|copiilor)|pe whatsapp|pe telegram|pe hangouts|scrie-?mi pe/),
    !!(fl.RF_PAYMENT_REQUEST || fl.RF_TOO_GOOD) || has(all, /bilet|avion|vama|colet|cadou|spital|operatie|cont blocat|mostenire|card cadou|carduri cadou|bitcoin|crypto|platforma de investitii|investitie/),
    has(all, /ti-?i dau inapoi|ti le dau inapoi|iti dau inapoi|returnez|vom fi impreuna|viitorul nostru|profit|te rambursez|bogati impreuna/)
  ];
  var box = el("div","love"); box.setAttribute("role","region");
  var h = el("h3",null,t("loveTitle")); box.appendChild(h);
  var ul = el("ul");
  found.forEach(function(f,i){

    li.appendChild(el("b",null,f?t("loveYes"):t("loveNo")));
    li.appendChild(el("span",null,t("loveS"+(i+1))));
    ul.appendChild(li);

/* ---------- thread ---------- */
function setHighlighted(node, text, hl){
  /* server offsets are Python code points; slice on code points, not UTF-16 units (emoji = 2 units) */
  var cps = Array.from(text), len = cps.length;
  function sl(a,b){ return cps.slice(a,b).join(""); }
  var segs = (Array.isArray(hl)?hl:[]).filter(function(h){ return h && isFinite(h.start) && isFinite(h.end) && h.end>h.start; })
    .map(function(h){ return {s:Math.max(0,h.start|0), e:Math.min(len,h.end|0), f:h.flag}; })
    .filter(function(h){ return h.e>h.s; }).sort(function(a,b){ return a.s-b.s || b.e-a.e; });
  var pos=0;
  segs.forEach(function(h){
    if(h.s<pos){ return; }
    if(h.s>pos) node.appendChild(document.createTextNode(sl(pos,h.s)));
    var m = el("mark",null,sl(h.s,h.e)); if(h.f) m.title=flagName(h.f); node.appendChild(m);
    pos=h.e;
  });
  if(pos<len) node.appendChild(document.createTextNode(sl(pos)));
}
function riskBar(score, verdict){
  var w = el("div","risk");
  var bar = el("div","rbar"); bar.setAttribute("role","img");
  bar.setAttribute("aria-label",t("risk")+" "+score+"/100");
  var fill = el("div","rfill"); fill.style.width = Math.max(0,Math.min(100,score))+"%";
  fill.style.background = score>=50?VCOLOR.SCAM : score>=25?VCOLOR.SUSPICIOUS : VCOLOR.SAFE;
  bar.appendChild(fill);
  [25,50].forEach(function(x){ var k=el("div","rtick"); k.style.left=x+"%"; bar.appendChild(k); });
  w.appendChild(bar);
  var tx = el("div","rtxt"); tx.appendChild(el("span",null,t("risk")+": "+score+"/100")); tx.appendChild(el("span",null,t("thr")));
  w.appendChild(tx); return w;
}
function buildThread(r){
  var th = el("div","thread");
  var fa = r.first_alert;
  (r.per_message||[]).forEach(function(m){
    var isReader = m.from==="reader";
    var wrap = el("div","bwrap "+(isReader?"reader":"sender")+((fa!==null&&fa!==undefined&&m.n===fa&&!isReader)?" first":""));
    if(wrap.classList.contains("first")) wrap.appendChild(el("div","firstlbl","⚠ "+t("firstHere")));
    wrap.appendChild(el("div","who",(isReader?t("reader"):t("sender"))+" · #"+m.n));
    var b = el("div","bubble"); setHighlighted(b, String(m.text==null?"":m.text), m.highlights); wrap.appendChild(b);
    if(m.new_flags && m.new_flags.length){
      var nf = el("div","tags nf"); m.new_flags.forEach(function(f){ nf.appendChild(el("span","tag","⚠ "+flagName(f))); }); wrap.appendChild(nf);
    }
    if(!isReader && typeof m.cumulative_score==="number") wrap.appendChild(riskBar(m.cumulative_score, m.verdict_so_far));

drop.addEventListener("drop",function(e){
  var dt=e.dataTransfer; if(!dt) return;
  var items=dt.items, entries=[], i;
  if(items && items.length && items[0].webkitGetAsEntry){
    for(i=0;i<items.length;i++){ var en=items[i].webkitGetAsEntry(); if(en) entries.push(en); }
    walk(entries).then(runFiles).catch(function(){ runFiles(Array.prototype.slice.call(dt.files)); });
  } else runFiles(Array.prototype.slice.call(dt.files));
});
function walk(entries){
  var files=[];
  function one(en){
    if(en.isFile) return new Promise(function(res){ en.file(function(f){ files.push(f); res(); },function(){ res(); }); });
    if(en.isDirectory){
      var rd=en.createReader(), all=[];
      return new Promise(function(res){
        (function more(){ rd.readEntries(function(b){ if(!b.length){ res(); return; } all=all.concat(Array.prototype.slice.call(b)); more(); },function(){ res(); }); })();
      }).then(function(){ return seq(all); });
    }
    return Promise.resolve();
  }
  function seq(list){ return list.reduce(function(p,en){ return p.then(function(){ return one(en); }); },Promise.resolve()); }

}

        var o; try{ o=JSON.parse(txt); }catch(e){ failed++; state.rows.push({id:f.name.replace(/\.json$/i,""),res:null}); return; }
        if(!isScenario(o)){ failed++; state.rows.push({id:(o&&o.id)||f.name.replace(/\.json$/i,""),res:null}); return; }
        return postJSON("/api/analyze",o).then(function(r){
          state.rows.push({id:String(r.id||o.id||f.name.replace(/\.json$/i,"")),res:r});
        }).catch(function(e){ failed++; if(e.kind==="server") serverDown=true; state.rows.push({id:String(o.id||f.name),res:null}); });

function parseCsv(text){
  var rows=[],row=[],cur="",q=false,i,c;
  text=text.replace(/^﻿/,"");
  for(i=0;i<text.length;i++){ c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur);cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cur);cur=""; rows.push(row);row=[]; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || (r[0]&&r[0].trim()); });
}

    if((r.first_alert==null?"":String(r.first_alert))===ex.first_alert) ok.first_alert++;
  });
  var s=t("cmpTitle")+": "+t("cmpVerdict")+" "+ok.verdict+"/"+n+" · "+t("cmpType")+" "+ok.scam_type+"/"+n+" · "+t("cmpFirst")+" "+ok.first_alert+"/"+n;
  if(miss.length) s+=" · "+t("cmpMissing")+miss.join(", ");
  out.textContent=s;
}

/* ---------- import a conversation ---------- */
var IMP_MAX = 100000, PREV_MAX = 200;
var imp = { parsed:null, me:null, seq:0, timer:null, busy:false };
function impMsg(m){ var b=$("impMsg"); if(!m){ b.classList.add("hidden"); return; } b.textContent=m; b.classList.remove("hidden"); }
function postPlain(url, body){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){ if(!r.ok){ var e=new Error("http"); e.kind="bad"; throw e; } return r.json(); },
         function(){ var e=new Error("net"); e.kind="server"; throw e; });
}
function lowFold(s){ try{ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }catch(e){ return String(s).toLowerCase().trim(); } }
function guessMe(parts){
  var i, names=["eu","tu","me","you"];
  for(i=0;i<parts.length;i++) if(names.indexOf(lowFold(parts[i]))>=0) return parts[i];
  var rem=null; try{ rem=localStorage.getItem("sb_me"); }catch(e){}
  if(rem && parts.indexOf(rem)>=0) return rem;
  return null;
}
function impMulti(){ return !!(imp.parsed && imp.parsed.participants && imp.parsed.participants.length>=2); }
function renderImport(){
  var p = imp.parsed, step=$("impStep");
  if(!p || !p.messages || !p.messages.length){ step.classList.add("hidden"); return; }
  step.classList.remove("hidden");
  var multi = impMulti();
  $("impFmt").textContent = t("fmt_"+p.format) + " · " + p.messages.length + t("impMsgs");
  var q=$("impQ"), btns=$("impBtns"); clear(btns);
  if(multi){
    q.textContent = t("impQ");
    p.participants.forEach(function(name){
      var b=el("button","pbtn"); b.type="button";
      var sel = name===imp.me;
      b.setAttribute("aria-pressed", sel?"true":"false");
      b.appendChild(el("span",null,sel?"\u2714 ":"")); b.appendChild(el("span",null,name));
      b.onclick=function(){ imp.me=name; try{ localStorage.setItem("sb_me",name); }catch(e){} impMsg(""); renderImport(); };
      btns.appendChild(b);
    });
  } else {
    q.textContent = t(p.format==="plain" ? "impPlain" : "impOne");
  }
  $("impGoTxt").textContent = t(multi ? "impGo" : "impGoSingle");
  var th=$("impThread"); clear(th);
  p.messages.slice(0,PREV_MAX).forEach(function(m,i){
    var isMe = multi && m.author===imp.me;
    var w = el("div","bwrap "+(isMe?"reader":"sender"));
    w.appendChild(el("div","who",(isMe?t("reader"):(m.author||t("sender")))+" \u00b7 #"+(i+1)));
    w.appendChild(el("div","bubble",m.text));
    th.appendChild(w);
  });
  if(p.messages.length>PREV_MAX) th.appendChild(el("div","hint",t("impMore")));
}
function impParse(){
  var txt = $("impTxt").value, my = ++imp.seq;
  impMsg(""); clear($("impResult"));
  if(!txt.trim()){ imp.parsed=null; renderImport(); return; }
  if(txt.length>IMP_MAX){ imp.parsed=null; renderImport(); impMsg(t("impLong")); return; }
  postPlain("/api/parse-chat",{text:txt}).then(function(j){
    if(my!==imp.seq) return;
    if(!j || !Array.isArray(j.messages) || !Array.isArray(j.participants)){ var e=new Error("shape"); e.kind="bad"; throw e; }
    imp.parsed = j;
    imp.me = j.participants.length>=2 ? guessMe(j.participants) : null;
    if(!j.messages.length) impMsg(t("impEmpty"));
    renderImport();
  }).catch(function(e){ if(my!==imp.seq) return; imp.parsed=null; renderImport(); impMsg(errMsg(e)); });
}
$("impTxt").addEventListener("input", function(){
  $("impNote").classList.add("hidden");
  imp.seq++; imp.parsed=null; renderImport();
  clearTimeout(imp.timer); imp.timer=setTimeout(impParse,350);
});
$("impFileBtn").onclick=function(){ $("impFile").value=""; $("impFile").click(); };
$("impFile").onchange=function(){
  var f=this.files&&this.files[0]; if(!f) return;
  readText(f).then(function(txt){
    $("impTxt").value=txt;
    var n=$("impNote"); n.textContent=t("impFile")+f.name; n.classList.remove("hidden");
    impParse();
  }).catch(function(){ impMsg(t("errBad")); });
};
$("impGo").onclick=function(){
  if(imp.busy || !imp.parsed) return;
  impMsg("");
  var multi=impMulti();
  if(multi && imp.me===null){ impMsg(t("impSelNone")); return; }
  var known=$("impKnown").checked;
  imp.busy=true; $("impGo").disabled=true; $("impGoTxt").textContent=t("checking");
  postPlain("/api/analyze-chat",{text:$("impTxt").value,me:multi?imp.me:null,channel:$("impChan").value,known_contact:known})
   .then(function(r){
      if(!r || typeof r!=="object" || !r.verdict){ var e=new Error("shape"); e.kind="bad"; throw e; }
      state.last=r; state.lastKnown=known; renderResult(r, known, "impResult");
   })
   .catch(function(e){ impMsg(errMsg(e)); })
   .then(function(){ imp.busy=false; $("impGo").disabled=false; $("impGoTxt").textContent=t(impMulti()?"impGo":"impGoSingle"); });
};

/* ---------- start ---------- */
applyLang(); pollHealth(); setInterval(pollHealth,20000);
})();
</script>
